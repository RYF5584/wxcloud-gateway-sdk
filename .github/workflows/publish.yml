name: Publish to PyPI

# Publishing is triggered by pushing a v* tag, or manually.
#
# Authentication (choose one; Trusted Publisher OIDC is the default):
#
# 1. Trusted Publisher (recommended, no token to manage):
#    On the PyPI project page -> Publishing -> add a GitHub Trusted Publisher:
#      - Owner:            RYF5584
#      - Repository:       wxcloud-gateway-sdk
#      - Workflow name:    publish.yml
#      - Environment:      pypi
#
# 2. API Token (fallback):
#    In GitHub repository Settings -> Secrets and variables -> Actions, add
#    PYPI_API_TOKEN, then uncomment the password line in the publish step
#    below and remove the environment / id-token permission (OIDC becomes
#    unavailable).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      # Required for Trusted Publisher OIDC authentication
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publisher (OIDC) mode: no username/password needed.
          # To switch to an API token, uncomment the line below and configure
          # the PYPI_API_TOKEN secret:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
